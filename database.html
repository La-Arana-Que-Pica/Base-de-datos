  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Base de Datos PES 2018 Actualizada - Jugadores, Equipos y Stats</title>
  <meta name="description" content="Consultá la base de datos de PES 2018 de LAqP con jugadores, equipos, ligas, medias, stats, posiciones, caras y datos conectados al Option File actualizado." />
  <link rel="canonical" href="https://laqp.website/database.html" />
  <meta property="og:title" content="Base de Datos PES 2018 Actualizada - Jugadores, Equipos y Stats" />
  <meta property="og:description" content="Explorá jugadores, equipos, ligas, medias, stats y posiciones del Option File PES 2018 de LAqP." />
  <meta property="og:image" content="https://laqp.website/img/logo.png" />
  <meta property="og:url" content="https://laqp.website/database.html" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Base de Datos PES 2018 Actualizada - LAqP" />
  <meta name="twitter:description" content="Jugadores, equipos, ligas, medias y stats del Option File PES 2018 actualizado." />
  <meta name="twitter:image" content="https://laqp.website/img/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="img/logo.webp" type="image/webp" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "Inicio", "item": "https://laqp.website/" },
      { "@type": "ListItem", "position": 2, "name": "Base de datos", "item": "https://laqp.website/database.html" }
    ]
  }
  </script>
  <!-- Preconnect for YouTube thumbnails / embeds (used in tutorials) -->
  <link rel="preconnect" href="https://img.youtube.com" crossorigin />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5301686002102491"
     crossorigin="anonymous"></script>
</head>
<body>

  <!-- ── Header ── -->
  <header id="header">
    <img
      class="logo"
      src="img/logo.webp"
      onerror="this.onerror=null;this.src='img/logo.webp'"
      alt="Logo"
      onclick="goHome()"
      style="cursor:pointer"
    />
    <div class="header-title">
      Base de datos Option File <span>PES 2018–2026</span>
    </div>
    <nav class="header-nav" aria-label="Menu principal">
      <a href="downloads.html" class="header-nav-link header-nav-link-primary">Option Files</a>
      <a href="tutorials.html" class="header-nav-link">Tutoriales</a>
      <a href="database.html" class="header-nav-link active">Base de datos</a>
    </nav>
    <div id="search-container">
      <span class="search-icon">🔍</span>
      <input
        type="text"
        id="search-input"
        placeholder="Buscar jugadores..."
        data-i18n-placeholder="search.players"
        autocomplete="off"
      />
    </div>
  </header>

  <!-- ── Main layout ── -->
  <div id="layout">

    <!-- Sidebar -->
    <nav id="sidebar">
      <!-- Built dynamically by JS -->
    </nav>

    <!-- Content area -->
    <main id="main">

      <!-- Loading overlay -->
      <div id="loading-overlay">
        <div class="spinner"></div>
        <span class="loading-message" data-i18n="loading.database">Cargando base de datos...</span>
      </div>

      <!-- Home view -->
      <div id="home-view">
        <div class="breadcrumb-row">
          <nav class="breadcrumbs" aria-label="Breadcrumb">
            <a href="index.html" data-i18n="common.home">Inicio</a>
            <span data-i18n="common.database">Base de datos</span>
          </nav>
        </div>
        <div class="home-welcome db-home-welcome">
          <h1 data-i18n="db.homeTitle">Base de datos de jugadores</h1>
          <p data-i18n="db.homeDesc">Explora ligas, equipos y jugadores desde un menu interno simple.</p>
        </div>
        <div class="db-home-menu">
          <button class="db-menu-card" type="button" onclick="showLeaguesView()">
            <span class="db-menu-card-title" data-i18n="db.exploreLeagues">Explorar ligas</span>
            <span class="db-menu-card-desc" data-i18n="db.exploreLeaguesDesc">Ver competiciones y sus equipos</span>
          </button>
          <button class="db-menu-card" type="button" onclick="showTeamsView()">
            <span class="db-menu-card-title" data-i18n="db.exploreTeams">Explorar equipos</span>
            <span class="db-menu-card-desc" data-i18n="db.exploreTeamsDesc">Entrar directo a clubes y selecciones</span>
          </button>
          <button class="db-menu-card" type="button" onclick="showAllPlayersAndFocusSearch()">
            <span class="db-menu-card-title" data-i18n="db.searchPlayers">Buscar jugadores</span>
            <span class="db-menu-card-desc" data-i18n="db.searchPlayersDesc">Filtrar por nombre, club, media y habilidades</span>
          </button>
        </div>
        <div class="stats-grid db-stats-grid">
          <div class="stat-card" onclick="showLeaguesView()">
            <div class="number" id="stat-leagues">0</div>
            <div class="label" data-i18n="common.leagues">Ligas</div>
          </div>
          <div class="stat-card" onclick="showTeamsView()">
            <div class="number" id="stat-teams">0</div>
            <div class="label" data-i18n="common.teams">Equipos</div>
          </div>
          <div class="stat-card" onclick="showAllPlayers()">
            <div class="number" id="stat-players">0</div>
            <div class="label" data-i18n="common.players">Jugadores</div>
          </div>
          <div class="stat-card" onclick="showFavoritesView()">
            <div class="number" id="stat-favorites">⭐</div>
            <div class="label" data-i18n="db.myFavorites">Mis favoritos</div>
          </div>
        </div>
      </div>

      <!-- Players list view -->
      <div id="players-view">
        <!-- Filled dynamically -->
      </div>

      <!-- Individual player profile view -->
      <div id="player-view">
        <!-- Filled dynamically -->
      </div>

      <!-- Search results view -->
      <div id="search-view">
        <!-- Filled dynamically -->
      </div>

      <!-- Leagues grid view -->
      <div id="leagues-view">
        <!-- Filled dynamically -->
      </div>

      <!-- Teams grid view -->
      <div id="teams-grid-view">
        <!-- Filled dynamically -->
      </div>

      <!-- Favorites view -->
      <div id="favorites-view">
        <!-- Filled dynamically -->
      </div>

    </main>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/site.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
