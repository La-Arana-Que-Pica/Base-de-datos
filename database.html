<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Base de datos – Option File PES 2018–2026</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="img/logo.webp" type="image/webp" />
  <!-- Preconnect for YouTube thumbnails / embeds (used in tutorials) -->
  <link rel="preconnect" href="https://img.youtube.com" crossorigin />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5301686002102491"
     crossorigin="anonymous"></script>
</head>
<body>

  <!-- ── Header ── -->
  <header id="header">
    <img
      class="logo"
      src="img/logo.webp"
      onerror="this.onerror=null;this.src='img/logo.webp'"
      alt="Logo"
      onclick="goHome()"
      style="cursor:pointer"
    />
    <h1>
      Base de datos Option File <span>PES 2018–2026</span>
    </h1>
    <nav class="header-nav" aria-label="Menu principal">
      <a href="downloads.html" class="header-nav-link header-nav-link-primary">Option Files</a>
      <a href="tutorials.html" class="header-nav-link">Tutoriales</a>
      <a href="database.html" class="header-nav-link active">Base de datos</a>
    </nav>
    <div id="search-container">
      <span class="search-icon">🔍</span>
      <input
        type="text"
        id="search-input"
        placeholder="Buscar jugadores..."
        autocomplete="off"
      />
    </div>
  </header>

  <!-- ── Main layout ── -->
  <div id="layout">

    <!-- Sidebar -->
    <nav id="sidebar">
      <!-- Built dynamically by JS -->
    </nav>

    <!-- Content area -->
    <main id="main">

      <!-- Loading overlay -->
      <div id="loading-overlay">
        <div class="spinner"></div>
        <span class="loading-message">Cargando base de datos...</span>
      </div>

      <!-- Home view -->
      <div id="home-view">
        <nav class="breadcrumbs" aria-label="Breadcrumb">
          <a href="index.html">Inicio</a>
          <span>Base de datos</span>
        </nav>
        <div class="home-welcome db-home-welcome">
          <h2>Base de datos de jugadores</h2>
          <p>Explora ligas, equipos y jugadores desde un menu interno simple.</p>
        </div>
        <div class="db-home-menu">
          <button class="db-menu-card" type="button" onclick="showLeaguesView()">
            <span class="db-menu-card-title">Explorar ligas</span>
            <span class="db-menu-card-desc">Ver competiciones y sus equipos</span>
          </button>
          <button class="db-menu-card" type="button" onclick="showTeamsView()">
            <span class="db-menu-card-title">Explorar equipos</span>
            <span class="db-menu-card-desc">Entrar directo a clubes y selecciones</span>
          </button>
          <button class="db-menu-card" type="button" onclick="showAllPlayersAndFocusSearch()">
            <span class="db-menu-card-title">Buscar jugadores</span>
            <span class="db-menu-card-desc">Filtrar por nombre, club, media y habilidades</span>
          </button>
        </div>
        <div class="stats-grid db-stats-grid">
          <div class="stat-card" onclick="showLeaguesView()">
            <div class="number" id="stat-leagues">0</div>
            <div class="label">Ligas</div>
          </div>
          <div class="stat-card" onclick="showTeamsView()">
            <div class="number" id="stat-teams">0</div>
            <div class="label">Equipos</div>
          </div>
          <div class="stat-card" onclick="showAllPlayers()">
            <div class="number" id="stat-players">0</div>
            <div class="label">Jugadores</div>
          </div>
          <div class="stat-card" onclick="showFavoritesView()">
            <div class="number" id="stat-favorites">⭐</div>
            <div class="label">Mis favoritos</div>
          </div>
        </div>
      </div>

      <!-- Players list view -->
      <div id="players-view">
        <!-- Filled dynamically -->
      </div>

      <!-- Individual player profile view -->
      <div id="player-view">
        <!-- Filled dynamically -->
      </div>

      <!-- Search results view -->
      <div id="search-view">
        <!-- Filled dynamically -->
      </div>

      <!-- Leagues grid view -->
      <div id="leagues-view">
        <!-- Filled dynamically -->
      </div>

      <!-- Teams grid view -->
      <div id="teams-grid-view">
        <!-- Filled dynamically -->
      </div>

      <!-- Favorites view -->
      <div id="favorites-view">
        <!-- Filled dynamically -->
      </div>

    </main>
  </div>

  <script src="js/site.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
