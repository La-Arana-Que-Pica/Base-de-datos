# GitHub Pages publica desde la raiz para conservar todas las URLs actuales.
# Todo el material que no pertenece al runtime público está centralizado aquí y
# no debe copiarse al sitio generado por Jekyll.
exclude:
  - Herramientas
  - Desarrollo
  - supabase
  - scripts
  - .tmp
  - .agents
  - .codex
  - AGENTS.md
  - LAQP_DRAFT_BETA_RELEASE.md
  - draft/docs
  - draft/tests
  - draft/staging
  - draft/scripts
  - draft/server
  - draft/sql
  - draft/release
